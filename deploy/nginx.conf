# Nginx 日志配置
error_log /opt/island_bells/logs/nginx-error.log warn;
access_log /opt/island_bells/logs/nginx-access.log combined;

server {
    listen 80;
    server_name _;  # 接受任意域名/IP 访问

    # 前端静态文件 (Vite 构建产物)
    root /opt/island_bells/web/dist;
    index index.html;

    # API 代理 → FastAPI 后端
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # WebSocket 长连接保持 24h
        proxy_send_timeout 86400s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # SPA 路由: 所有非文件请求 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全: 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
